# MJ HUB 官網（www2 測試站）nginx 設定
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 測試站：不給搜尋引擎收錄（正式站上線後 canonical 歸正式網域）
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---- 內部檔案一律擋下（repo 直接掛載，策略文件不可外流）----
    location ~ /\. { deny all; return 404; }                 # .git/.codex/.claude/.playwright 等隱藏目錄
    location ~* \.(md|ya?ml|py|conf|lock)$ { deny all; return 404; }
    location ~* (docker-compose|Dockerfile|AGENTS) { deny all; return 404; }

    # HTML 一律重新驗證（測試站改版頻繁，避免舊頁面卡快取）
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 靜態資源快取 1 小時即可（曾設 7 天導致 Cloudflare 邊緣抱著舊 CSS 不放）
    location ~* \.(jpg|jpeg|png|ico|css|js|svg|webp)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;
    gzip_min_length 1024;
}
